name: Explore
on: [push, workflow_dispatch]
jobs:
  explore:
    runs-on: windows-latest
    steps:
      - name: Clone SDK
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git
      - name: List folders
        run: |
          dir plugin-sdk\tools
          dir plugin-sdk\tools\premake
      - name: Show SDK own build file
        run: Get-Content plugin-sdk\.github\workflows\*.yml
