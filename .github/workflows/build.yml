name: Explore
on: [push, workflow_dispatch]
jobs:
  explore:
    runs-on: windows-latest
    steps:
      - name: Clone SDK
        run: git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git
      - name: Show premake step
        run: |
          Select-String -Path plugin-sdk\.github\workflows\Build_Plugin_GTA_SA.yml -Pattern "Premake Visual Studio project" -Context 0,8 | Out-String
